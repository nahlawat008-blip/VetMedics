<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Appointment | VetMedics</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eefcf9;
            color: #193443;
        }

        .appointment-page {
            min-height: 100vh;
            padding: 35px 20px 70px;
            background:
                linear-gradient(
                    rgba(238,252,249,0.88),
                    rgba(238,252,249,0.88)
                ),
                url("images/appointment-bg.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .appointment-wrapper {
            max-width: 900px;
            margin: auto;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 18px;

            border: 1px solid #0f9d8a;
            border-radius: 10px;

            color: #0f9d8a;
            background: white;

            text-decoration: none;
            font-weight: 600;

            margin-bottom: 30px;
        }

        .back-home:hover {
            background: #0f9d8a;
            color: white;
        }

        .appointment-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .appointment-heading h1 {
            margin: 0;
            font-size: 48px;
            line-height: 1.1;
            color: #193443;
        }

        .appointment-heading h1 span {
            color: #0f9d8a;
        }

        .appointment-heading p {
            margin-top: 15px;
            color: #5c6b73;
            font-size: 18px;
        }

        .paw {
            color: #0f9d8a;
            font-size: 28px;
            margin: 12px 0;
        }

        .appointment-card {
            max-width: 620px;
            margin: auto;

            background: rgba(255,255,255,0.97);

            padding: 38px;

            border-radius: 22px;

            box-shadow:
                0 15px 45px rgba(0,0,0,0.10);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 15px;
            font-weight: 700;
            color: #193443;
        }

        .form-group input,
        .form-group select {

            width: 100%;

            padding: 15px 16px;

            border: 1px solid #d6dede;
            border-radius: 10px;

            background: white;

            font-size: 16px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0f9d8a;

            box-shadow:
                0 0 0 3px rgba(15,157,138,0.10);
        }

        .appointment-submit {

            width: 100%;

            padding: 16px;

            border: none;
            border-radius: 11px;

            background: #0f9d8a;
            color: white;

            font-size: 17px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .appointment-submit:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .success-message {

            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            background: #e7f8f4;

            color: #087d6e;

            text-align: center;

            font-weight: 600;
        }

        .appointment-note {

            max-width: 620px;

            margin: 25px auto 0;

            padding: 18px;

            border-radius: 12px;

            background: rgba(255,255,255,0.85);

            text-align: center;

            color: #53636a;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .appointment-page {
                padding: 20px 15px 50px;
                background-attachment: scroll;
            }

            .appointment-heading h1 {
                font-size: 34px;
            }

            .appointment-heading p {
                font-size: 16px;
            }

            .appointment-card {
                padding: 25px 20px;
                border-radius: 16px;
            }

            .back-home {
                margin-bottom: 20px;
            }

        }

    </style>

</head>


<body>

    <main class="appointment-page">

        <div class="appointment-wrapper">

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>


            <div class="appointment-heading">

                <h1>
                    Book an <span>Appointment</span>
                </h1>

                <div class="paw">
                    🐾
                </div>

                <p>
                    Please fill in your details to register
                    your appointment.
                </p>

            </div>


            <div class="appointment-card">

                <form id="appointmentForm">


                    <div class="form-group">

                        <label for="ownerName">
                            Your Name
                        </label>

                        <input
                            type="text"
                            id="ownerName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phoneNumber">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phoneNumber"
                            placeholder="Enter 10 digit phone number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="petName">
                            Pet Name
                        </label>

                        <input
                            type="text"
                            id="petName"
                            placeholder="Enter your pet's name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="serviceType">
                            Type of Service
                        </label>

                        <select
                            id="serviceType"
                            required
                        >

                            <option value="">
                                Select Service
                            </option>

                            <option value="Vaccination">
                                Vaccination
                            </option>

                            <option value="Home Visit">
                                Home Visit
                            </option>

                            <option value="Grooming">
                                Grooming
                            </option>

                            <option value="Health Checkup">
                                Health Checkup
                            </option>

                            <option value="Surgery">
                                Surgery
                            </option>

                            <option value="Lab Test">
                                Lab Test
                            </option>

                            <option value="Teleconsultation">
                                Teleconsultation
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="appointment-submit"
                    >
                        Submit Appointment
                    </button>


                </form>


                <div
                    id="successMessage"
                    class="success-message"
                >
                    ✅ Appointment registered successfully!
                </div>

            </div>


            <div class="appointment-note">

                🐾 Our team will review your request
                and contact you shortly.

            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
